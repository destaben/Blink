# The desks a release is proved on. This fork has one board on one Mac, so the
# inventory is that one desk; the upstream three-desk fleet does not apply here.
#
# There is deliberately NO port in this file. The daemon finds the board by
# USB VID:PID (claude_usage_bridge.py:41-48, CH340 0x1A86:0x7523), which is
# how it picks COM15 out of the Windows desk's twelve mostly-Bluetooth COM
# ports. A port written down here would work until somebody moved the cable
# to the next socket, and would then fail as a dead board.
#
# `python` must be an interpreter WITH PYSERIAL on that machine: the agent
# spawns blink_main.py, which imports serial at module scope. Checking that
# is a one-liner per desk and is worth doing before blaming the hardware:
#
#     <python> -c "import serial; print(serial.__version__)"

[hosts.local-mac]
ssh = ""                    # empty = run here, with no ssh at all
os = "darwin"
# Measured 2026-10-20: board 48aff36b0f10 on this desk is stamped CLAUDE
# (tools/burn.sh --edition claude). The only board this fork owns.
board = "claude"
# Relative paths are resolved against this checkout, not the workdir. The
# fleet venv is the only interpreter on this Mac that has pyserial, and it is
# gitignored, so it is not inside the snapshot that gets pushed.
python = ".venv-test/bin/python"
workdir = "~/blink-fleet"
has_claude_desktop = true

